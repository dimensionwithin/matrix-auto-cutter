[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "matrix-auto-cutter"
version = "0.1.0"
description = "Zeitbasis-, Journal-, Sidecar- und Protection-Kern des Matrix Auto Cutter"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11,<3", "numpy>=2.0,<3"]

[project.scripts]
matrix-auto-finalize = "matrix_auto_cutter.manual_finalizer:main"
matrix-auto-runner = "matrix_auto_cutter.product_runner:main"
matrix-auto-review = "matrix_auto_cutter.review_app:main"
matrix-auto-shorts = "matrix_auto_cutter.shorts.app:main"
matrix-auto-shorts-urteilsserver = "matrix_auto_cutter.shorts.judge_server:main"

[project.optional-dependencies]
repeat = ["rapidfuzz>=3,<4"]
dev = [
  "hypothesis>=6.135,<7",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/matrix_auto_cutter"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "echter_unterprozess: dieser Test darf wirklich einen Unterprozess starten",
]

[tool.coverage.run]
branch = true
source = ["matrix_auto_cutter"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ANN", "B", "D", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = [
  "COM812",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D", "PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
